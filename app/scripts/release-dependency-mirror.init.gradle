// Optional recovery for network timeouts. Never applies to unrelated projects,
// never replaces remote repositories, and only offers checksum-verified files.
gradle.beforeProject { project ->
    def mirrorSetting = gradle.startParameter.projectProperties.get('pakhlaiVerifiedMirror')
    if (!mirrorSetting) return
    def mirror = new File(mirrorSetting).canonicalFile
    def expected = new File(project.rootProject.projectDir, '../build/android-toolchain/maven').canonicalFile
    if (mirror != expected || !mirror.isDirectory()) return
    [project.repositories, project.buildscript.repositories].each { repositories ->
        def repository = repositories.maven {
            name = 'PakhlaiVerifiedReleaseRecovery'
            url = mirror.toURI()
            content {
                includeVersion('com.android.tools.lint', 'lint-checks', '32.1.0')
                includeVersion('com.android.tools.external.com-intellij', 'intellij-core', '32.1.0')
                includeVersion('com.android.tools.external.com-intellij', 'kotlin-compiler', '32.1.0')
                includeVersion('org.codehaus.groovy', 'groovy', '3.0.22')
            }
            metadataSources {
                mavenPom()
                artifact()
                ignoreGradleMetadataRedirection()
            }
        }
        repositories.remove(repository)
        repositories.addFirst(repository)
    }
}
